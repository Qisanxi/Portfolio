<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#120E08"/>
      <stop offset="100%" style="stop-color:#1C1710"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C4913F"/>
      <stop offset="100%" style="stop-color:#DDB87A"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="35%" r="55%">
      <stop offset="0%" style="stop-color:#C4913F;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#120E08;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Warm glow overlay -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid lines — subtle -->
  <g opacity="0.04" stroke="#C4913F" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Left accent bar -->
  <rect x="72" y="160" width="3" height="310" fill="url(#accentGrad)" rx="2" opacity="0.6"/>

  <!-- Logo mark — top left -->
  <text x="72" y="88" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#C4913F" opacity="0.9">&lt;SK/&gt;</text>

  <!-- "Available for opportunities" pill -->
  <rect x="72" y="110" width="218" height="26" rx="13" fill="rgba(74,222,128,0.08)" stroke="rgba(74,222,128,0.25)" stroke-width="1"/>
  <circle cx="91" cy="123" r="4" fill="#4ade80"/>
  <text x="102" y="127" font-family="monospace, Courier" font-size="11" fill="#4ade80" letter-spacing="0.5">Open to opportunities</text>

  <!-- Main heading — Sandeep Kumar -->
  <text x="88" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#EDE4CF" letter-spacing="-2">Sandeep Kumar</text>

  <!-- Accent dot on name -->
  <text x="88" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#EDE4CF" letter-spacing="-2">Sandeep Kumar<tspan fill="#C4913F">.</tspan></text>

  <!-- Role line -->
  <text x="91" y="302" font-family="monospace, Courier" font-size="20" fill="#9A8E78" letter-spacing="0.5">~$ Software Engineer · Python Backend · AI Builder</text>

  <!-- Divider line -->
  <line x1="88" y1="334" x2="700" y2="334" stroke="rgba(196,145,63,0.2)" stroke-width="1"/>

  <!-- Description -->
  <text x="91" y="370" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#5C5446" letter-spacing="0.2">Building AI agents, autonomous content tools,</text>
  <text x="91" y="393" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#5C5446" letter-spacing="0.2">and scalable FastAPI backends from India.</text>

  <!-- Tech tags -->
  <g font-family="monospace, Courier" font-size="12" letter-spacing="0.3">
    <!-- Python -->
    <rect x="88" y="424" width="72" height="26" rx="6" fill="rgba(196,145,63,0.08)" stroke="rgba(196,145,63,0.22)" stroke-width="1"/>
    <text x="100" y="441" fill="#C4913F">Python</text>

    <!-- FastAPI -->
    <rect x="170" y="424" width="72" height="26" rx="6" fill="rgba(196,145,63,0.08)" stroke="rgba(196,145,63,0.22)" stroke-width="1"/>
    <text x="182" y="441" fill="#C4913F">FastAPI</text>

    <!-- React -->
    <rect x="252" y="424" width="64" height="26" rx="6" fill="rgba(196,145,63,0.08)" stroke="rgba(196,145,63,0.22)" stroke-width="1"/>
    <text x="264" y="441" fill="#C4913F">React</text>

    <!-- Google GenAI -->
    <rect x="326" y="424" width="118" height="26" rx="6" fill="rgba(196,145,63,0.08)" stroke="rgba(196,145,63,0.22)" stroke-width="1"/>
    <text x="338" y="441" fill="#C4913F">Google GenAI</text>

    <!-- AWS -->
    <rect x="454" y="424" width="56" height="26" rx="6" fill="rgba(196,145,63,0.08)" stroke="rgba(196,145,63,0.22)" stroke-width="1"/>
    <text x="466" y="441" fill="#C4913F">AWS</text>

    <!-- Docker -->
    <rect x="520" y="424" width="68" height="26" rx="6" fill="rgba(196,145,63,0.08)" stroke="rgba(196,145,63,0.22)" stroke-width="1"/>
    <text x="532" y="441" fill="#C4913F">Docker</text>
  </g>

  <!-- Portfolio URL — bottom -->
  <text x="91" y="558" font-family="monospace, Courier" font-size="14" fill="#5C5446" letter-spacing="1">github.com/Qisanxi</text>

  <!-- Right side — decorative code block -->
  <rect x="780" y="140" width="350" height="350" rx="16" fill="rgba(196,145,63,0.03)" stroke="rgba(196,145,63,0.1)" stroke-width="1"/>

  <!-- Code snippet decoration -->
  <g font-family="monospace, Courier" font-size="13" letter-spacing="0.3">
    <text x="810" y="180" fill="#38342C">// Sandeep Kumar — Portfolio</text>
    <text x="810" y="210" fill="#5C5446">const <tspan fill="#9A8E78">developer</tspan> = {</text>
    <text x="826" y="238" fill="#5C5446">role: <tspan fill="#C4913F">"AI Backend Engineer"</tspan>,</text>
    <text x="826" y="264" fill="#5C5446">stack: <tspan fill="#C4913F">["Python", "FastAPI",</tspan></text>
    <text x="842" y="290" fill="#C4913F">       "React", "GenAI"]</tspan>,</text>
    <text x="826" y="316" fill="#5C5446">projects: <tspan fill="#9A8E78">5+</tspan>,</text>
    <text x="826" y="342" fill="#5C5446">available: <tspan fill="#4ade80">true</tspan>,</text>
    <text x="826" y="368" fill="#5C5446">location: <tspan fill="#C4913F">"India"</tspan>,</text>
    <text x="810" y="396" fill="#5C5446">};</text>
    <!-- Cursor blink -->
    <rect x="810" y="412" width="8" height="16" fill="#C4913F" opacity="0.7" rx="1"/>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="596" width="1200" height="34" fill="rgba(196,145,63,0.04)"/>
  <line x1="0" y1="596" x2="1200" y2="596" stroke="rgba(196,145,63,0.12)" stroke-width="1"/>
  <text x="72" y="619" font-family="monospace, Courier" font-size="12" fill="#5C5446" letter-spacing="0.5">Sandeep Kumar · Software Engineer · BCA @ Patliputra University</text>
</svg>
