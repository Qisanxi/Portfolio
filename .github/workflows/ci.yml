# CI — runs on every PR and every push to main.
# Three jobs in parallel:
#   1. backend-tests  — pytest with SQLite in-memory DB (no Postgres needed)
#   2. frontend-tests  — vitest with jsdom (no browser needed)
#   3. frontend-build  — vite build to confirm the bundle compiles
# If any job fails, the PR is blocked from merging.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests use SQLite in-memory, so DATABASE_URL doesn't need a real Postgres.
      # conftest.py overrides this anyway, but setting it here prevents the
      # config loader from crashing on import.
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      GEMINI_API_KEY: 'ci-stub-not-real'
      FRONTEND_URL: 'http://localhost:5173'
      DEBUG: 'True'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Run vitest
        run: npm test

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true  # pre-existing warnings shouldn't block PRs

  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
